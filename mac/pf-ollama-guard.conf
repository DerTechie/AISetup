# Ollama guard (pf) — restrict inbound TCP :11434 to localhost + the NAS gateway.
#
# The Mac's Ollama listens on 0.0.0.0:11434 (LAN) so the NAS LiteLLM gateway
# (10.63.0.2) can reach the `private` model. That API is unauthenticated, so we
# fence the port to the NAS only. This Mac otherwise uses the Application
# Firewall, not pf, so a self-contained default-pass ruleset is acceptable —
# it mirrors the surgical Arch nftables guard (arch/nftables-ollama-guard.nft)
# and leaves all other traffic untouched.
#
# Loaded as the active pf ruleset at boot by the com.ollama.pfguard LaunchDaemon.
# pf is last-match-wins, but `quick` makes the block decisive on match.

table <ollama_allow> const { 127.0.0.1, 10.63.0.2 }
set skip on lo0
block drop in quick proto tcp from ! <ollama_allow> to any port 11434
