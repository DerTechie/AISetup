# systemd drop-in for the Ollama service on the Arch workstation.
# Installed to: /etc/systemd/system/ollama.service.d/lan.conf
#
# Makes Ollama listen on the LAN (not just localhost) so the Mac LiteLLM
# gateway can reach it for the `aux-local` route. Still listens on localhost
# too, so a future local coding-autocomplete tool is unaffected.
# Access is fenced by nftables-ollama-guard.nft (localhost + Mac only).
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
