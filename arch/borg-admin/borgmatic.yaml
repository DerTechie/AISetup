# Borgmatic config — Arch admin-side. Used for prune (weekly) and full check
# (monthly), plus ad-hoc restore. Does NOT create archives — that's the NAS
# stack's job.

repositories:
  - path: ssh://u600186@u600186.your-storagebox.de:23/./borg-repo
    label: hetzner-bx21

# Passphrase via a small wrapper script (~/.local/bin/borg-get-passphrase).
# The script tries `op read` first (works when 1Password desktop session is up)
# and falls back to the BORG_PASSPHRASE env var that systemd's EnvironmentFile
# provides for timer runs. We don't inline the shell here because Borg shlex-splits
# BORG_PASSCOMMAND before exec'ing, which mangles single-quoted paths with spaces.
encryption_passcommand: /home/dertechie/.local/bin/borg-get-passphrase

# Same retention contract as nas/borgmatic/borgmatic.yaml — but ENFORCED here.
# borgmatic 2.x: keep_* at top level (the `retention:` section is deprecated).
keep_daily: 7
keep_weekly: 4
keep_monthly: 12
keep_yearly: 3

# Monthly deep check — verify-data reads & decrypts every chunk in the repo,
# catching silent corruption that the fast structural check would miss.
# Expensive: hours on a large repo and saturates upload. Worth it once a month.
checks:
  - name: repository
  - name: archives
  - name: data

# Use the admin SSH key. Port 23.
ssh_command: ssh -p 23 -i ~/.ssh/borg-admin-arch -o StrictHostKeyChecking=accept-new

# Failure notification: see arch/borg-admin/README.md. The admin side does
# NOT have a healthchecks deadman wired yet — prune (weekly) and check
# (monthly) failures are currently silent. Either add per-action healthchecks
# checks (free tier supports more than enough), or accept that admin failures
# only surface when borgmatic's exit code is read by the systemd timer's
# OnFailure target. Decision pending; flagged in plan Task 15 follow-up.
