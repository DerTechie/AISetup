services:
  litellm-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - /mnt/nvme/apps/litellm/pgdata:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: always
    depends_on:
      - litellm-db
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Encrypts API keys stored in the DB (store_model_in_db). DB-stored models do NOT
      # resolve `os.environ/...` refs at call time the way config models do, so their keys
      # are stored as encrypted literals — this salt derives the encryption key. Set once,
      # NEVER change it (changing it breaks decryption of every stored credential).
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  prices-refresher:
    build: ./prices-refresher
    restart: always
    depends_on:
      - litellm
    environment:
      # Intra-compose DNS — no host port exposed; refresher only talks to litellm.
      LITELLM_GATEWAY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # 3600s = 1h. OpenRouter prices move at most weekly in practice; bump if noisy.
      REFRESH_INTERVAL_SEC: "3600"
