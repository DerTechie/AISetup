# Borgmatic — orchestrates nightly Borg archive to the Hetzner Storage Box.
# Deploy as its own Dockge stack on a NAS pool path (10.63.0.2). Container has
# read-only source mounts; the writer SSH key is mounted 0600.
#
# PG dump strategy is split by orchestrator:
#  - Dockge stacks (litellm pg 16, langfuse pg 16): native pg_dump from this
#    container over the joined {stack}_default network. Image's pg_dump 17.x
#    handles pg 16 servers fine.
#  - TrueNAS apps (n8n / paperless / immich, all pg 18+): docker-exec into the
#    actual postgres container so the dump uses each app's own pg_dump (always
#    version-matched). Requires DOCKER_CLI + docker socket mount. No network
#    join needed for these — see borgmatic.yaml `pg_dump_command:` overrides.
services:
  borgmatic:
    image: ghcr.io/borgmatic-collective/borgmatic:latest
    restart: always
    hostname: nas-aisetup
    environment:
      TZ: Europe/Berlin
      # Cron — env var names per borgmatic-collective's s6-overlay init scripts:
      #   BACKUP_CRON = the schedule (just "m h dom mon dow", no user field)
      #   EXTRA_CRON  = a full extra crontab line appended after the main one
      # We want daily 05:00 create + weekly Sun 06:00 repo-only check.
      BACKUP_CRON: "0 5 * * *"
      EXTRA_CRON: "0 6 * * 0 /usr/local/bin/borgmatic --verbosity 1 check --only repository 2>&1"
      # Install docker CLI at container start so pg_dump_command overrides can
      # `docker exec` into the TrueNAS app pg containers (Pattern B for
      # version-matched dumps). Requires the socket mount in volumes:.
      # (Env var name is DOCKERCLI per the image's init-custom-packages script.)
      DOCKERCLI: "true"
      BORG_PASSPHRASE: ${BORG_PASSPHRASE}
      # Pre-hook DB creds (used inside borgmatic.yaml):
      LITELLM_PG_PASSWORD:  ${LITELLM_PG_PASSWORD}
      LANGFUSE_PG_PASSWORD: ${LANGFUSE_PG_PASSWORD}
      N8N_PG_PASSWORD:      ${N8N_PG_PASSWORD}
      PAPERLESS_PG_PASSWORD: ${PAPERLESS_PG_PASSWORD}
      IMMICH_PG_PASSWORD:   ${IMMICH_PG_PASSWORD}
      CLICKHOUSE_PASSWORD:  ${CLICKHOUSE_PASSWORD}
      # Failure-path hook (healthchecks deadman; ntfy alerting is configured
      # as a healthchecks.io integration, not as a borgmatic-side hook):
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL}
    volumes:
      # Config:
      - ./borgmatic.yaml:/etc/borgmatic/config.yaml:ro
      # Writer SSH key (host-side perms 0600, root-owned):
      - /mnt/nvme/apps/borgmatic/secrets/borg-writer-nas:/root/.ssh/id_ed25519:ro
      - /mnt/nvme/apps/borgmatic/secrets/borg-writer-nas.pub:/root/.ssh/id_ed25519.pub:ro
      # Docker socket — used by `pg_dump_command: docker exec ...` overrides
      # for the TrueNAS-app pg dumps. Grants this container root-equivalent
      # access via the daemon; acceptable since it already holds the writer
      # key + RO mounts of all app data.
      - /var/run/docker.sock:/var/run/docker.sock
      # Local Borg cache + state (persistent so dedup index isn't rebuilt every run):
      - /mnt/nvme/apps/borgmatic/borg-cache:/root/.cache/borg
      - /mnt/nvme/apps/borgmatic/borg-config:/root/.config/borg
      # Source datasets (READ-ONLY — backup must never mutate live):
      - /mnt/nvme/apps/dockge:/source/nvme/dockge:ro
      - /mnt/nvme/apps/n8n:/source/nvme/n8n:ro
      - /mnt/nvme/apps/paperless-ngx:/source/nvme/paperless-ngx:ro
      - /mnt/nvme/apps/immich:/source/nvme/immich:ro
      - /mnt/nvme/apps/nginx-proxy-manager:/source/nvme/nginx-proxy-manager:ro
      - /mnt/nvme/apps/pihole:/source/nvme/pihole:ro
      - /mnt/nvme/apps/litellm:/source/nvme/litellm:ro
      - /mnt/nvme/apps/langfuse:/source/nvme/langfuse:ro
      - /mnt/nvme/apps/metrics:/source/nvme/metrics:ro
      - /mnt/nvme/apps/forgejo:/source/nvme/forgejo:ro
      - /mnt/tank/apps/immich/data:/source/tank/immich-data:ro
      - /mnt/tank/apps/paperless-ngx:/source/tank/paperless-ngx:ro
      - /mnt/tank/apps/forgejo/lfs:/source/tank/forgejo-lfs:ro
      - /mnt/tank/storage:/source/tank/storage:ro
    networks:
      - litellm_default                          # native pg_dump against litellm-db (pg 16)
      - langfuse_default                         # native pg_dump (postgres pg 16) + clickhouse-client
      # n8n / paperless / immich dumps go via `docker exec` (pg_dump_command
      # override in borgmatic.yaml) so no network join is needed for them.

networks:
  litellm_default:  { external: true }
  langfuse_default: { external: true }
