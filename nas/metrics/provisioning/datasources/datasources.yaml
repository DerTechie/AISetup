apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: LiteLLM Postgres (read-only)
    uid: litellm-pg
    type: postgres
    access: proxy
    # Reached over the gateway stack's external Docker network (joined in docker-compose.yml).
    url: litellm-db:5432
    user: grafana_ro
    jsonData:
      # Grafana 11+ reads the SQL database name from jsonData.database; the old
      # top-level `database:` field is ignored for Postgres ("no default database").
      database: litellm
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $GRAFANA_DB_RO_PASSWORD
