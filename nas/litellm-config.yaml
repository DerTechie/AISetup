# Model routes are stored in the DATABASE (store_model_in_db), NOT in this file, so they
# can be added / edited / swapped live in the UI or via /model/new + /model/update with no
# redeploy. (Config-defined models are read-only in the UI — that was the friction this
# migration removes; see docs/journal/2026-05-22-litellm-models-in-db.md.)
#
# Bootstrap / disaster-recovery definitions for a fresh DB live in nas/models.seed.json;
# apply them with `python3 nas/seed_models.py`. Per-route rationale rides into the DB as
# each model's model_info.description (visible in the UI). The route re-pick rationale is in
# docs/journal/2026-05-22-model-route-repick-tool-use.md.
#
# TRADE-OFF (accepted): live model state can drift from models.seed.json — the seed file is a
# bootstrap, not per-change history. Routing safety logic that must stay reviewable in git
# (fallbacks, retries, callbacks) stays below.

litellm_settings:
  drop_params: true
  num_retries: 2
  # main hits its budget cap -> degrade to private (slow local brain), never die.
  # deep vendor outage/error -> deep-fallback (different vendor).
  # Fallbacks match by model_name, so they resolve against the DB-stored routes.
  # No context_window_fallbacks: the triage advisor decides overflow targets (per redesign spec).
  fallbacks: [{"main": ["private"]}, {"deep": ["deep-fallback"]}]
  # Per-request traces -> Langfuse on the NAS (async, fire-and-forget; never blocks a request).
  success_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true   # routes live in Postgres; add/edit/swap in the UI without a restart
